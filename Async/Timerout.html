<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <P>Topics covered: Asynchronous JavaScript, setTimeout, setInterval , Callbacks , EventHandling , dom-MAnipulation
    </P>
    <h1>CHAI AUR ODE</h1>
    <button id="btn">Click me</button>
    <h1 id="date"></h1>
    <button id="stop">Stop</button>
    <script>
        setTimeout(function () {
            console.log("Hello world");
        }, 3000);
        //     function mydate() {
        //       let date = new Date();
        //    console.log(date);
        //  document.getElementById("date").innerHTML = date;
        //  };
        // setInterval(mydate, 1000);
        // Callback functions {first is inside addEventListener and second is setInterval insidea function }
        let intervalId;

        document.getElementById("btn").addEventListener("click", function () {
            // let date = new Date();
            if (!intervalId) {

                intervalId = setInterval(function () {
                    console.log("Running...");

                    document.getElementById("date").innerHTML = new Date() + "<br>";
                }, 1000);
            }
        });

        document.getElementById("stop").addEventListener("click", function () {
            clearInterval(intervalId);
            intervalId = undefined; // reset
        });
    </script>
</body>

</html>
