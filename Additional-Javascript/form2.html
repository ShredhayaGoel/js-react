<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Document</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

</head>

<body>
    <form id="userForm" class="max-w-md mx-auto mt-10 p-6 bg-white shadow-lg rounded-lg">

        <h2 class=" text-2xl font-bold mb-4 text-center">User Form</h2>

        <label class="block mb-1 font-medium">Name</label>

        <input type="text" id="name" name="name" placeholder="Enter your name"
            class="w-full p-2 mb-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">

        <label class=" block mb-1 font-medium">Email</label>

        <input type="text" id="email" name="email" placeholder="Enter your email"
            class="w-full p-2 mb-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">

        <label class=" block mb-1 font-medium">Password</label>

        <input type="text" id="password" name="password" placeholder="Enter your password"
            class="w-full p-2 mb-4 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-400">

        <button type="submit"
            class="w-full bg-blue-500 text-white p-2 rounded-lg hover:bg-blue-800 transition duration-2000">
            Submit

        </button>

    </form>

</body>

<script>

    console.log("JS loaded");

    const form = document.getElementById('userForm')

    form.addEventListener('submit',

        async function user(e) {
            e.preventDefault();
            console.log("Form submitted");

            const name = document.getElementById('name').value;

            const email = document.getElementById('email').value;

            const password = document.getElementById('password').value;

            const data = {
                name: name,
                email: email,
                password: password
            }

            try {
                const responsee = await fetch('https://jsonplaceholder.typicode.com/users');

                const res = await responsee.json();

                console.log("FULL DATA API RESPONSE", res)

                const response = await fetch('https://jsonplaceholder.typicode.com/users',
                    {

                        method: "POST",
                        body: JSON.stringify(data),
                        headers: {
                            "Content-Type": "application/json"
                        }
                    }
                );

                const result = await response.json();
                console.log("NEW DATA", result);
            }

            catch (error) {
                console.log('error', error);
            }
        }
    )
</script>

</html>
